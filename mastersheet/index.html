<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tổng Hợp Tài Sản | WorkHub Finance</title>
    <link rel="icon" type="image/png" href="../logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
      /* Dong bo dark mode voi app shell truoc khi trang ve (cung logic voi script.js: auto = 18h-6h) */
      (function () {
        try {
          var t = localStorage.getItem('user-theme');
          var h = new Date().getHours();
          if (t === 'dark' || ((t === 'auto' || !t) && (h >= 18 || h < 6))) {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/style.css?v=3.1.0">
    <link rel="stylesheet" href="/finance-shared.css?v=1.2">
    <link rel="stylesheet" href="/mastersheet/style.css?v=3.0">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#B08D57">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WorkHub">
    <link rel="apple-touch-icon" href="/logo.png">
    </head>
<body>

    <div class="asset-container">
        
        <div class="top-bar">
            <div class="left-section">
                <a href="../" class="back-link">
                    <i class="fa-solid fa-house"></i> <span>Finance</span>
                </a>
                <h1>Tổng Hợp Tài Sản</h1>
            </div>

            <div class="right-section">
                <button onclick="loadMemberList()" class="btn-refresh">
                    <i class="fa-solid fa-rotate-right"></i> Làm mới
                </button>
            </div>
        </div>

        <nav class="fin-tool-nav">
            <a href="/mastersheet/" class="active"><i class="fa-solid fa-users"></i> Tổng Hợp TS</a>
            <a href="/mastersheet/assets/"><i class="fa-solid fa-sack-dollar"></i> Nhập Liệu TS</a>
            <a href="/stocksheet/"><i class="fa-solid fa-chart-column"></i> Tổng Hợp CP</a>
            <a href="/stocksheet/autosheet/"><i class="fa-solid fa-calculator"></i> Định Giá CP</a>
        </nav>

        <div class="kpi-row">
            <div class="kpi-card">
                <span class="kpi-icon"><i class="fa-solid fa-users"></i></span>
                <span class="kpi-body">
                    <span class="kpi-label">Số thành viên</span>
                    <span class="kpi-value" id="team-kpi-count">--</span>
                </span>
            </div>
            <div class="kpi-card">
                <span class="kpi-icon"><i class="fa-solid fa-sack-dollar"></i></span>
                <span class="kpi-body">
                    <span class="kpi-label">Tổng NAV Team</span>
                    <span class="kpi-value" id="team-kpi-nav">--</span>
                </span>
            </div>
        </div>

        <div class="control-panel">
            <label><i class="fa-solid fa-user-tag"></i> Chọn thành viên:</label>
            <select id="member-select" onchange="loadMemberDetail()">
                <option value="">-- Đang tải danh sách... --</option>
            </select>
        </div>

        <div id="sheet-display" class="spreadsheet-wrapper" style="display: none; padding: 20px; overflow-x: auto;">
            <table id="member-table" class="asset-table" style="width: 100%;"></table>
        </div>

        <div id="loading-spinner" style="display:none; text-align:center; padding: 50px;">
            <i class="fa-solid fa-spinner fa-spin fa-2x" style="color: var(--finance-accent);"></i>
            <p style="margin-top: 10px; color: var(--text-secondary);">Đang tải dữ liệu...</p>
        </div>

        <div class="holdings-layout" style="margin-top: 30px;">
            <div class="spreadsheet-wrapper">
                <table id="team-table" class="asset-table" style="width:100%;">
                    <thead>
                        <tr>
                            <th>Thành viên</th>
                            <th class="text-right">Tổng NAV</th>
                            <th class="text-center">Tỉ trọng</th>
                        </tr>
                    </thead>
                    <tbody id="team-table-body">
                        <tr><td colspan="3" class="empty-state">Đang tải...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="allocation-card">
                <h3><i class="fa-solid fa-chart-pie"></i> Cơ Cấu Tài Sản</h3>
                <div class="allocation-chart-box">
                    <canvas id="teamChart"></canvas>
                </div>
                <div class="allocation-legend" id="team-legend"></div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../api.js?v=8"></script>
    <script src="script.js?v=4"></script>
</body>
</html>
