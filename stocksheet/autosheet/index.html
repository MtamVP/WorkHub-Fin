<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Định Giá Cổ Phiếu | WorkHub Finance</title>
    
    <link rel="icon" type="image/png" href="../../logo.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">

    <script>
      /* Dong bo dark mode voi app shell truoc khi trang ve (cung logic voi script.js: auto = 18h-6h) */
      (function () {
        try {
          var t = localStorage.getItem('user-theme');
          var h = new Date().getHours();
          if (t === 'dark' || ((t === 'auto' || !t) && (h >= 18 || h < 6))) {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/style.css?v=3.1.0">
    <link rel="stylesheet" href="/finance-shared.css?v=1.3">
    <link rel="stylesheet" href="/stocksheet/autosheet/style.css?v=3.0">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#B08D57">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WorkHub">
    <link rel="apple-touch-icon" href="/logo.png">
</head>
<body>

    <div class="asset-container">
        
        <div class="top-bar">
            <div class="left-section">
                <a href="/" class="back-link">
                    <i class="fa-solid fa-house"></i> <span>Finance</span>
                </a>
                <h1>Định Giá Cổ Phiếu</h1>
            </div>

            <div class="right-section">
                <button onclick="saveToSheet()" class="btn-save btn-save-cloud" id="btn-save-sheet"><i class="fa-solid fa-cloud-arrow-up"></i> Lưu vào Supabase</button>
                <button onclick="resetData()" class="btn-refresh">
                    <i class="fa-solid fa-rotate-right"></i> Nhập lại
                </button>
            </div>
        </div>

        <nav class="fin-tool-nav">
            <a href="/mastersheet/"><i class="fa-solid fa-users"></i> Tổng Hợp TS</a>
            <a href="/mastersheet/assets/"><i class="fa-solid fa-sack-dollar"></i> Nhập Liệu TS</a>
            <a href="/stocksheet/"><i class="fa-solid fa-chart-column"></i> Tổng Hợp CP</a>
            <a href="/stocksheet/autosheet/" class="active"><i class="fa-solid fa-calculator"></i> Định Giá CP</a>
        </nav>

        <div class="calc-wrapper">

            <div class="stock-header" style="gap: 20px;">
                <div class="stock-header-field">
                    <label for="stock-symbol">Mã Cổ Phiếu:</label>
                    <input type="text" id="stock-symbol" class="stock-header-input" placeholder="VD: SHS" style="text-transform: uppercase;">
                </div>

                <div class="stock-header-field">
                    <label for="stock-year">Năm:</label>
                    <input type="number" id="stock-year" class="stock-header-input year-input" value="2026">
                </div>
            </div>

            <h3 class="stock-section-title"><i class="fa-solid fa-pen-to-square"></i> Chỉ Số Đầu Vào</h3>
            <div class="input-field-grid">
                <div class="input-field">
                    <label for="val-1">Vốn điều lệ</label>
                    <input type="text" class="input-val" id="val-1" placeholder="Nhập số...">
                </div>
                <div class="input-field">
                    <label for="val-2">Vốn chủ sở hữu</label>
                    <input type="text" class="input-val" id="val-2" placeholder="Nhập số...">
                </div>
                <div class="input-field">
                    <label for="val-3">Lợi nhuận sau thuế</label>
                    <input type="text" class="input-val" id="val-3" placeholder="Nhập số...">
                </div>
                <div class="input-field">
                    <label for="val-6" class="input-field-highlight-label">Giá cổ phiếu hiện tại</label>
                    <input type="text" class="input-val highlight-input" id="val-6" placeholder="Nhập giá...">
                </div>
            </div>

            <h3 class="stock-section-title"><i class="fa-solid fa-calculator"></i> Chỉ Số Tính Toán</h3>
            <div class="stat-grid">
                <div class="stat-tile">
                    <span class="stat-tile-icon"><i class="fa-solid fa-book"></i></span>
                    <span class="stat-tile-label">Giá trị sổ sách</span>
                    <span class="stat-tile-value output-val" id="val-4">0</span>
                </div>
                <div class="stat-tile">
                    <span class="stat-tile-icon"><i class="fa-solid fa-chart-line"></i></span>
                    <span class="stat-tile-label">EPS</span>
                    <span class="stat-tile-value output-val" id="val-5">0</span>
                </div>
                <div class="stat-tile stat-tile-highlight">
                    <span class="stat-tile-icon"><i class="fa-solid fa-divide"></i></span>
                    <span class="stat-tile-label">P/E</span>
                    <span class="stat-tile-value output-val result" id="val-7">0</span>
                </div>
                <div class="stat-tile stat-tile-highlight">
                    <span class="stat-tile-icon"><i class="fa-solid fa-percent"></i></span>
                    <span class="stat-tile-label">P/B</span>
                    <span class="stat-tile-value output-val result" id="val-8">0</span>
                </div>
            </div>

            <div class="target-section">
                <h3 class="stock-section-title"><i class="fa-solid fa-bullseye"></i> Target</h3>
                <div class="target-grid">
                    <div class="target-card">
                        <div class="target-card-title">Theo P/E</div>
                        <input type="text" class="input-val target-input" id="target-pe" placeholder="Nhập P/E...">
                        <div class="target-card-price-label">Price Target</div>
                        <div class="target-card-price output-val" id="price-per-pe">0</div>
                        <div class="target-card-price-label">Return (%) — Lợi nhuận</div>
                        <div class="output-val percent" id="return-pe">0%</div>
                    </div>
                    <div class="target-card">
                        <div class="target-card-title">Theo P/B</div>
                        <input type="text" class="input-val target-input" id="target-pb" placeholder="Nhập P/B...">
                        <div class="target-card-price-label">Price Target</div>
                        <div class="target-card-price output-val" id="price-per-pb">0</div>
                        <div class="target-card-price-label">Return (%) — Lợi nhuận</div>
                        <div class="output-val percent" id="return-pb">0%</div>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../api.js?v=8"></script>
    <script src="script.js?v=3"></script>

</body>
</html>
