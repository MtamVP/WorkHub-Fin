<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tổng hợp Cổ Phiếu | WorkHub Finance</title>
    <link rel="icon" type="image/png" href="../logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <script>
      /* Dong bo dark mode voi app shell truoc khi trang ve (cung logic voi script.js: auto = 18h-6h) */
      (function () {
        try {
          var t = localStorage.getItem('user-theme');
          var h = new Date().getHours();
          if (t === 'dark' || ((t === 'auto' || !t) && (h >= 18 || h < 6))) {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/style.css?v=1788630490059">
    <link rel="stylesheet" href="/finance-shared.css?v=2.7">
    <link rel="stylesheet" href="/stocksheet/style.css?v=1789060000000">
    <link rel="stylesheet" href="/stocksheet/valuation.css?v=1791800000000">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#B08D57">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WorkHub">
    <link rel="apple-touch-icon" href="/logo.png">
</head>
<body class="desk">

    <header class="desk-topbar">
        <div class="desk-topbar-inner">
            <div class="desk-wordmark">
                <span class="glyph" aria-hidden="true">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-5 4 3 5-7"/></svg>
                </span>
                WorkHub Finance <span class="sub">· Bàn Tài Sản</span>
            </div>
            <nav class="desk-nav">
                <a href="/mastersheet/"><i class="fa-solid fa-users"></i> Tổng Hợp TS</a>
                <a href="/mastersheet/assets/"><i class="fa-solid fa-sack-dollar"></i> Nhập Liệu TS</a>
                <a href="/stocksheet/" class="active"><i class="fa-solid fa-chart-column"></i> Tổng Hợp CP</a>
                <a href="/stocksheet/autosheet/"><i class="fa-solid fa-calculator"></i> Định Giá CP</a>
            </nav>
            <div class="desk-topbar-right">
                <span class="desk-sync"><span class="dot"></span><span class="txt">Dữ liệu trực tiếp</span></span>
                <a href="/" class="desk-iconbtn" title="Về trang Finance"><i class="fa-solid fa-house"></i></a>
                <button class="desk-iconbtn" id="theme-btn" title="Đổi giao diện sáng / tối" onclick="toggleDeskTheme()" aria-label="Đổi giao diện sáng / tối"><i class="fa-solid fa-moon" id="theme-ic"></i></button>
            </div>
        </div>
    </header>

    <div class="asset-container desk">

        <div class="desk-byline">
            <h1>Tổng hợp cổ phiếu</h1>
            <span class="desk-who">
                <span class="av"><i class="fa-solid fa-database"></i></span>
                <span id="vl-who">Bảng định giá đã lưu</span>
            </span>
            <button onclick="refreshAll()" class="desk-iconbtn" title="Làm mới" aria-label="Làm mới"><i class="fa-solid fa-rotate-right"></i></button>
        </div>

        <div class="vl-viewbar">
            <div class="vl-seg" role="group" aria-label="Chế độ xem">
                <button type="button" id="seg-overview" aria-pressed="true" onclick="showView('overview')"><i class="fa-solid fa-table-list"></i> Bảng so sánh</button>
                <button type="button" id="seg-detail" aria-pressed="false" onclick="showView('detail')"><i class="fa-solid fa-magnifying-glass-chart"></i> Chi tiết mã</button>
            </div>
            <a class="btn-refresh" href="/stocksheet/autosheet/"><i class="fa-solid fa-plus"></i> Thêm / sửa định giá</a>
        </div>

        <!-- 1) BẢNG SO SÁNH: mọi mã đã định giá, kết luận Rẻ / Hợp lý / Đắt theo giá hiện tại -->
        <section id="view-overview" aria-label="Bảng so sánh các mã đã định giá">
            <div class="vl-summary" id="ov-summary"></div>
            <div class="vl-filters" id="ov-filters" role="group" aria-label="Lọc theo nhóm"></div>
            <div class="spreadsheet-wrapper vl-table-wrap" id="ov-table-wrap"></div>
            <p class="vl-hint" id="ov-hint"></p>
        </section>

        <!-- 2) CHI TIẾT MỘT MÃ -->
        <section id="view-detail" style="display:none;" aria-label="Chi tiết định giá một mã">
            <div class="control-panel">
                <label for="stock-select"><i class="fa-solid fa-magnifying-glass"></i> Chọn mã cổ phiếu:</label>
                <select id="stock-select" onchange="onSymbolChange()">
                    <option value="">-- Đang tải danh sách... --</option>
                </select>
                <label id="stock-year-label" for="stock-year-select" style="display:none;"><i class="fa-solid fa-calendar"></i> Năm số liệu:</label>
                <select id="stock-year-select" style="display:none;" onchange="loadStockDetail()"></select>
            </div>

            <div id="sheet-display" style="display: none;"></div>

            <div id="stock-empty-state" class="stock-empty-state">
                <i class="fa-solid fa-chart-column"></i>
                <p>Chọn một mã cổ phiếu ở trên (hoặc bấm vào một dòng ở Bảng so sánh) để xem chi tiết định giá.</p>
            </div>

            <div id="loading-spinner" style="display:none; text-align:center; padding: 50px;">
                <i class="fa-solid fa-spinner fa-spin fa-2x" style="color: var(--finance-accent);"></i>
            </div>
        </section>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../api.js?v=1791800000000"></script>
    <script src="../lib/valuation-calc.js?v=1791800000000"></script>
    <script src="valuation-ui.js?v=1791800000000"></script>
    <script src="script.js?v=1791800000000"></script>
</body>
</html>
