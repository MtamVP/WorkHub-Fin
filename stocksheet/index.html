<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tổng hợp Cổ Phiếu | WorkHub Finance</title>
    <link rel="icon" type="image/png" href="../logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <script>
      /* Dong bo dark mode voi app shell truoc khi trang ve (cung logic voi script.js: auto = 18h-6h) */
      (function () {
        try {
          var t = localStorage.getItem('user-theme');
          var h = new Date().getHours();
          if (t === 'dark' || ((t === 'auto' || !t) && (h >= 18 || h < 6))) {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/style.css?v=3.1.0">
    <link rel="stylesheet" href="/stocksheet/style.css?v=3.2">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#B08D57">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WorkHub">
    <link rel="apple-touch-icon" href="/logo.png">
</head>
<body>

    <div class="asset-container">
        
        <div class="top-bar">
            <div class="left-section">
                <a href="/stocksheet/autosheet/" class="back-link">
                    <i class="fa-solid fa-chevron-left"></i> <span>Nhập liệu</span>
                </a>

                <a href="/" class="back-link">
                    <i class="fa-solid fa-house"></i> <span>Finance</span>
                </a>
                <h1>Tổng hợp cổ phiếu</h1>
            </div>
            
            <div class="right-section">
                <button onclick="loadStockList()" class="btn-refresh">
                    <i class="fa-solid fa-rotate-right"></i> Làm mới
                </button>
                </div>
        </div>

        <div class="control-panel">
            <label><i class="fa-solid fa-magnifying-glass"></i> Chọn mã cổ phiếu:</label>
            <select id="stock-select" onchange="loadStockDetail()">
                <option value="">-- Đang tải danh sách... --</option>
            </select>
            <label id="stock-year-label" style="display:none;"><i class="fa-solid fa-calendar"></i> Năm:</label>
            <select id="stock-year-select" style="display:none;" onchange="loadStockDetail()"></select>
        </div>

        <div id="sheet-display" style="display: none;">
            <!-- Hero: Mã + Năm + Giá hiện tại -->
            <div class="stock-hero">
                <div class="stock-hero-id">
                    <span class="stock-hero-symbol" id="hero-symbol">--</span>
                    <span class="stock-hero-year" id="hero-year">--</span>
                </div>
                <div class="stock-hero-price">
                    <span class="stock-hero-price-label">Giá hiện tại</span>
                    <span class="stock-hero-price-value" id="hero-price">--</span>
                </div>
            </div>

            <!-- Chỉ số cơ bản -->
            <h3 class="stock-section-title"><i class="fa-solid fa-chart-simple"></i> Chỉ Số Cơ Bản</h3>
            <div class="stat-grid" id="fundamentals-grid"></div>

            <!-- Định giá mục tiêu -->
            <h3 class="stock-section-title"><i class="fa-solid fa-bullseye"></i> Định Giá Mục Tiêu</h3>
            <div class="target-grid" id="target-grid"></div>
        </div>

        <div id="trend-chart-wrapper" class="trend-chart-wrapper" style="display: none;">
            <h3 class="perf-chart-title"><i class="fa-solid fa-chart-line"></i> Xu hướng định giá theo năm</h3>
            <div style="position:relative; height:300px;" id="trend-chart-box">
                <canvas id="valuationTrendChart"></canvas>
            </div>
        </div>

        <div id="stock-empty-state" class="stock-empty-state">
            <i class="fa-solid fa-chart-column"></i>
            <p>Chọn một mã cổ phiếu ở trên để xem chi tiết định giá.</p>
        </div>

        <div id="loading-spinner" style="display:none; text-align:center; padding: 50px;">
            <i class="fa-solid fa-spinner fa-spin fa-2x" style="color: var(--finance-accent);"></i>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../api.js?v=6"></script>
    <script src="script.js?v=3"></script>
</body>
</html>
