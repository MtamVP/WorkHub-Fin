    <script>
      /* Dong bo dark mode voi app shell truoc khi trang ve (cung logic voi cac trang Investment Workbench: auto = 18h-6h) */
      (function () {
        try {
          var t = localStorage.getItem('user-theme');
          var h = new Date().getHours();
          if (t === 'dark' || ((t === 'auto' || !t) && (h >= 18 || h < 6))) {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
